<head>

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>

  <div class="frame">
    <p class="eyebrow">Database schema · Smart-ERP OLTP</p>
    <h1>Core OLTP tables · public schema</h1>

    <!--
      5 tables within complexity budget:
        customers (left)  sellers (bottom-left)  products (right)
        orders (centre)   order_items (centre-bottom, focal — has CHECK constraint)

      FK edges (6 max):
        1. orders.customer_id → customers.customer_id  ON DELETE RESTRICT
        2. orders → order_items.order_id               ON DELETE CASCADE  ← focal
        3. order_items.product_id → products.product_id  ON DELETE RESTRICT
        4. order_items.seller_id → sellers.seller_id     ON DELETE RESTRICT

      Focal: the order_items table (cascade target) — accent-tint header band
             + the CASCADE FK edge and label.

      Key invariant shown: final_price CHECK expressed in the column row note.

      viewBox: 1080 × 580
    -->

    <svg viewBox="0 0 1080 580" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-labelledby="schema-title schema-desc">
      <title id="schema-title">Smart-ERP core OLTP schema — five tables</title>
      <desc id="schema-desc">Physical schema diagram showing the five core tables: customers, sellers, products, orders, and order_items. Foreign keys connect order_items to all four parent tables. The orders-to-order_items relationship uses ON DELETE CASCADE; all others use ON DELETE RESTRICT. The final_price CHECK constraint enforces the money invariant on every order line.</desc>

      <defs>
        <marker id="arrow"        markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="1080" height="580" fill="#f5f5f5"/>

           orders left edge (x=400) row customer_id y=160+68+12=240 → customers right edge (x=256) y=120+68=188 -->
      <path d="M400 240 Q360 240 360 204 Q360 168 352 168 H256"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="290" y="208" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="346" y="217" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ON DELETE RESTRICT</text>

      <!-- FK2: orders.order_id → order_items.order_id  ON DELETE CASCADE (focal)

      <text x="500" y="325" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ON DELETE CASCADE</text>

      <!-- FK3: order_items.product_id → products.product_id  ON DELETE RESTRICT
           order_items right edge x=640 row product_id y=340+68+24=432 → products left edge x=760 y=120+68=188 -->
      <path d="M640 432 Q720 432 720 310 Q720 188 760 188"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="668" y="320" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="724" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ON DELETE RESTRICT</text>
