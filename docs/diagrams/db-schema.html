  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --sans: 'Geist', system-ui, sans-serif;

      --mono: 'Geist Mono', ui-monospace, monospace;

    body {
      font-family: var(--sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>

    <h1>Core OLTP tables · public schema</h1>

    <!--
      Type: database schema. 5 tables (type budget max), 4 FK edges.
      Layout: transaction spine down the centre (orders above order_items,
      one straight vertical FK), three parent tables flanking it. Every FK
      edge is horizontal or vertical with r=8 elbows; column rows that an
      edge touches share the same centre-Y, so three of the four edges are
      perfectly straight. No per-edge labels — all four FKs are bare
      REFERENCES (NO ACTION default), stated once in the legend.

      Truth notes (verified against database/migrations/002 + 004):
      - There is NO ON DELETE CASCADE / RESTRICT on any core FK. The only
        ON DELETE CASCADE in the whole schema is document_chunks → documents
        (007), which is out of scope here.
      - Focal story is the money invariant: final_price CHECK ±₹5.00 (004)
        on the fact hub order_items (accent header + accent money row).
      - orders shows 4 of 10 columns (+6 more); products 7 of 9 (+2 more);
        order_items names its omitted column. No empty INDEXES compartments.
      - inventory + service tables (audit_log, revenue_forecasts, documents)
        are out of scope (5-table budget) — see database/README.md.

      viewBox: 1100 × 652
    -->
