<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart-ERP Data Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #7a8399; --rule: rgba(45,49,66,0.12); --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans);
    }
    .frame { width: 100%; max-width: 1100px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 840px; }
    .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label
      { font-family: var(--mono); text-anchor: middle; }
    .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
    .step-label  { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
    .lane-label  { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .role-text   { fill: var(--ink); font-size: 6px; font-weight: 600; }
    .node-title  { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
    .node-sub    { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .node-tool   { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
    .chip-text   { fill: #ffffff; font-size: 5px; font-weight: 700; }
    .focal-text  { fill: var(--accent); }
    .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
    .legend-text  { fill: var(--muted); font: 400 7px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data flow · Smart-ERP</p>
    <h1>From transaction to analytical insight</h1>

    <!--
      Lanes:  APPLICATION (APP) · DATA PLATFORM (ENG) · ANALYTICS / Databricks (DBX) · CONSUMERS (CON)
      Steps:  01 WRITE · 02 INGEST · 03 TRANSFORM · 04 SERVE (focal) · 05 CONSUME
      viewBox: 840 × 436   (4 lanes × 80px + 36 header + 80 legend)
      Focal:  step 04 · node DBX:04 Gold Build · accent arrow ENG→DBX labeled CLEAN + DQ
    -->

    <svg viewBox="0 0 840 436" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-labelledby="df-title df-desc">
      <title id="df-title">Smart-ERP data flow from application to consumer</title>
      <desc id="df-desc">The application writes orders to PostgreSQL. A JDBC snapshot lands data in Databricks Bronze. The data platform cleanses and validates through Silver and the DQ gate. Gold KPI models are served to BI dashboards, the FastAPI analytics layer, and the React dashboard.</desc>

      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arr-muted"  markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/></marker>
        <marker id="arr-link"   markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
      </defs>

      <!-- Background -->
      <rect width="840" height="436" fill="#f5f5f5"/>
      <rect width="840" height="436" fill="url(#dots)"/>
      <!-- Alternating lane tints (lanes 0, 2) -->
      <rect x="0" y="36"  width="840" height="80" fill="rgba(45,49,66,0.018)"/>
      <rect x="0" y="196" width="840" height="80" fill="rgba(45,49,66,0.018)"/>

      <!-- Structural lines -->
      <line x1="0" y1="36"  x2="840" y2="36"  stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="840" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="840" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="840" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="356" x2="840" y2="356" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="356" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- Step header chips -->
      <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="196" y="14" class="step-number">01</text>
      <text x="196" y="29" class="step-label">WRITE</text>

      <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="308" y="14" class="step-number">02</text>
      <text x="308" y="29" class="step-label">INGEST</text>

      <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="420" y="14" class="step-number">03</text>
      <text x="420" y="29" class="step-label">TRANSFORM</text>

      <!-- focal step -->
      <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(235,108,54,0.20)"/>
      <text x="532" y="14" class="step-number focal-text">04</text>
      <text x="532" y="29" class="step-label focal-text">SERVE</text>

      <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="644" y="14" class="step-number">05</text>
      <text x="644" y="29" class="step-label">CONSUME</text>

      <!-- Lane labels -->
      <text x="70" y="68"  class="lane-label">APPLICATION</text>
      <text x="70" y="80"  class="lane-label">FastAPI · React</text>
      <text x="70" y="148" class="lane-label">DATA</text>
      <text x="70" y="160" class="lane-label">PLATFORM</text>
      <text x="70" y="228" class="lane-label">ANALYTICS</text>
      <text x="70" y="240" class="lane-label">Databricks</text>
      <text x="70" y="308" class="lane-label">CONSUMERS</text>
      <text x="70" y="320" class="lane-label">BI · ML · AI</text>

      <!-- ══ CONNECTORS — drawn before all node rects ══ -->

      <!-- APP:01 → PLAT:02 (cross-lane, JDBC snapshot) -->
      <path d="M246 76 Q246 116 246 116" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>

      <!-- PLAT:02 → PLAT:03 (same lane) -->
      <path d="M358 156 H370" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>

      <!-- PLAT:03 → DBX:04 (cross-lane, FOCAL — Clean + DQ) -->
      <path d="M420 188 V196" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <rect x="393" y="173" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="421" y="182" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CLEAN + DQ</text>

      <!-- DBX:04 → DBX:05 (same lane) -->
      <path d="M470 236 H482" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>

      <!-- DBX:05 → CON:05 BI (cross-lane, link) -->
      <path d="M532 268 V284" fill="none" stroke="#2e5aa8" marker-end="url(#arr-link)"/>

      <!-- APP:04 Stats API → CON:05 Dashboard (cross-lane, link) -->
      <path d="M582 76 Q582 80 582 80 V284" fill="none" stroke="#2e5aa8" stroke-dasharray="4,3" marker-end="url(#arr-link)"/>

      <!-- ══ NODES ══ -->

      <!-- APPLICATION lane (y_top=36, node_y=44) -->

      <!-- APP:01 — Create Orders / PostgreSQL -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/>
      <text x="159" y="53" class="role-text">APP</text>
      <text x="196" y="67" class="node-title">Create Orders</text>
      <text x="196" y="79" class="node-sub">6 OLTP tables</text>
      <text x="196" y="91" class="node-tool">PostgreSQL 16</text>
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="234" y="104" class="chip-text">DB</text>

      <!-- APP:04 — Stats / AI API -->
      <rect x="532" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="536" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/>
      <text x="545" y="53" class="role-text">APP</text>
      <text x="582" y="67" class="node-title">Stats + AI API</text>
      <text x="582" y="79" class="node-sub">/stats · /ai/ask</text>
      <text x="582" y="91" class="node-tool">FastAPI :8000</text>
      <rect x="536" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="544" y="104" class="chip-text">DB</text>
      <rect x="612" y="98" width="16" height="8" rx="3" fill="#9c6b50"/>
      <text x="620" y="104" class="chip-text">FL</text>

      <!-- DATA PLATFORM lane (y_top=116, node_y=124) -->

      <!-- PLAT:02 — Bronze Ingest -->
      <rect x="258" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="262" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/>
      <text x="271" y="133" class="role-text">ENG</text>
      <text x="308" y="147" class="node-title">Bronze Ingest</text>
      <text x="308" y="159" class="node-sub">raw_purchases · append</text>
      <text x="308" y="171" class="node-tool">01_bronze_backfill</text>
      <rect x="262" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="270" y="184" class="chip-text">DB</text>
      <rect x="338" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="346" y="184" class="chip-text">DB</text>

      <!-- PLAT:03 — Silver + DQ -->
      <rect x="370" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="374" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/>
      <text x="383" y="133" class="role-text">ENG</text>
      <text x="420" y="147" class="node-title">Silver + DQ Gate</text>
      <text x="420" y="159" class="node-sub">normalize · R1–R9</text>
      <text x="420" y="171" class="node-tool">02_silver · 03_dq_gate</text>
      <rect x="374" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="382" y="184" class="chip-text">DB</text>
      <rect x="450" y="178" width="16" height="8" rx="3" fill="#b8915a"/>
      <text x="458" y="184" class="chip-text">TB</text>

      <!-- ANALYTICS lane (y_top=196, node_y=204) -->

      <!-- DBX:04 — Gold Build (focal) -->
      <rect x="370" y="204" width="100" height="64" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="374" y="208" width="18" height="10" rx="3" fill="rgba(235,108,54,0.20)"/>
      <text x="383" y="213" class="role-text focal-text">DBX</text>
      <text x="420" y="227" class="node-title">Gold Build</text>
      <text x="420" y="239" class="node-sub">fact_sales · customer_360</text>
      <text x="420" y="251" class="node-tool">04_gold_build</text>
      <rect x="374" y="258" width="16" height="8" rx="3" fill="#b8915a"/>
      <text x="382" y="264" class="chip-text">TB</text>
      <rect x="450" y="258" width="16" height="8" rx="3" fill="#b8915a"/>
      <text x="458" y="264" class="chip-text">TB</text>

      <!-- DBX:05 — SQL Refresh -->
      <rect x="482" y="204" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="486" y="208" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/>
      <text x="495" y="213" class="role-text">DBX</text>
      <text x="532" y="227" class="node-title">SQL Refresh</text>
      <text x="532" y="239" class="node-sub">sales_daily · kpis</text>
      <text x="532" y="251" class="node-tool">sql_refresh task</text>
      <rect x="486" y="258" width="16" height="8" rx="3" fill="#b8915a"/>
      <text x="494" y="264" class="chip-text">TB</text>
      <rect x="562" y="258" width="16" height="8" rx="3" fill="#b8915a"/>
      <text x="570" y="264" class="chip-text">TB</text>

      <!-- CONSUMERS lane (y_top=276, node_y=284) -->

      <!-- CON:04 — BI Dashboards -->
      <rect x="482" y="284" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="486" y="288" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/>
      <text x="495" y="293" class="role-text">BI</text>
      <text x="532" y="307" class="node-title">BI Dashboards</text>
      <text x="532" y="319" class="node-sub">revenue · fulfillment</text>
      <text x="532" y="331" class="node-tool">Databricks SQL</text>
      <rect x="486" y="338" width="16" height="8" rx="3" fill="#b8915a"/>
      <text x="494" y="344" class="chip-text">TB</text>
      <rect x="562" y="338" width="16" height="8" rx="3" fill="#9c6b50"/>
      <text x="570" y="344" class="chip-text">FL</text>

      <!-- CON:05 — React Dashboard -->
      <rect x="594" y="284" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="598" y="288" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/>
      <text x="607" y="293" class="role-text">WEB</text>
      <text x="644" y="307" class="node-title">React Dashboard</text>
      <text x="644" y="319" class="node-sub">operators · analysts</text>
      <text x="644" y="331" class="node-tool">localhost:5173</text>
      <rect x="598" y="338" width="16" height="8" rx="3" fill="#9c6b50"/>
      <text x="606" y="344" class="chip-text">FL</text>
      <rect x="674" y="338" width="16" height="8" rx="3" fill="#9c6b50"/>
      <text x="682" y="344" class="chip-text">FL</text>

      <!-- ══ LEGEND ══ -->
      <line x1="0" y1="356" x2="840" y2="356" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <!-- Row 1: STEPS -->
      <text x="136" y="373" class="legend-label">STEPS</text>
      <rect x="140" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/>
      <text x="152" y="372" class="step-number">01</text><text x="170" y="373" class="legend-text">Write</text>
      <rect x="216" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/>
      <text x="228" y="372" class="step-number">02</text><text x="246" y="373" class="legend-text">Ingest</text>
      <rect x="300" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/>
      <text x="312" y="372" class="step-number">03</text><text x="330" y="373" class="legend-text">Transform</text>
      <rect x="408" y="364" width="24" height="12" rx="6" fill="rgba(235,108,54,0.20)"/>
      <text x="420" y="372" class="step-number focal-text">04</text><text x="438" y="373" class="legend-text">Serve</text>
      <rect x="492" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/>
      <text x="504" y="372" class="step-number">05</text><text x="522" y="373" class="legend-text">Consume</text>

      <!-- Row 2: DATA TYPE -->
      <text x="136" y="394" class="legend-label">DATA TYPE</text>
      <rect x="140" y="386" width="16" height="8" rx="3" fill="#5e7a9b"/>
      <text x="148" y="392" class="chip-text">DB</text><text x="162" y="394" class="legend-text">Dataset / Delta</text>
      <rect x="252" y="386" width="16" height="8" rx="3" fill="#b8915a"/>
      <text x="260" y="392" class="chip-text">TB</text><text x="274" y="394" class="legend-text">Table / Gold mart</text>
      <rect x="368" y="386" width="16" height="8" rx="3" fill="#9c6b50"/>
      <text x="376" y="392" class="chip-text">FL</text><text x="390" y="394" class="legend-text">Report / JSON</text>
      <text x="476" y="394" class="legend-text">left = input · right = output</text>

      <!-- Row 3: FLOW -->
      <text x="136" y="416" class="legend-label">FLOW</text>
      <line x1="140" y1="413" x2="164" y2="413" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <text x="170" y="416" class="legend-text">Standard</text>
      <line x1="248" y1="413" x2="272" y2="413" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <text x="278" y="416" class="legend-text">Clean + DQ (focal)</text>
      <line x1="388" y1="413" x2="412" y2="413" stroke="#2e5aa8" marker-end="url(#arr-link)"/>
      <text x="418" y="416" class="legend-text">Published to consumers</text>
      <line x1="568" y1="413" x2="592" y2="413" stroke="#2e5aa8" stroke-dasharray="4,3" marker-end="url(#arr-link)"/>
      <text x="598" y="416" class="legend-text">API read (live)</text>
    </svg>
  </main>
</body>
</html>
