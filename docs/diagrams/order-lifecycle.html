<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart-ERP Order Lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 900px; width: 100%; }
    .eyebrow { font-family: var(--mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Smart-ERP</p>
    <h1>Order delivery lifecycle</h1>

    <!--
      States:    ● → IN TRANSIT → {DELIVERED (focal), DELAYED, RETURNED}
      Invariant: terminal states are immutable (API enforces, DB CHECK on enum)
      viewBox:   800 × 400
    -->

    <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-labelledby="state-title state-desc">
      <title id="state-title">Order delivery lifecycle state machine</title>
      <desc id="state-desc">An order starts IN TRANSIT and moves to one of three terminal states: DELIVERED (happy path, accent), DELAYED (late delivery), or RETURNED (customer return). Terminal states are immutable — no further transitions are allowed.</desc>

      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow"        markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="800" height="400" fill="#f5f5f5"/>
      <rect width="800" height="400" fill="url(#dots)" opacity="0.55"/>

      <!-- ══ TRANSITIONS (drawn first) ══ -->

      <!-- Start dot → IN TRANSIT -->
      <line x1="56" y1="184" x2="100" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- IN TRANSIT → DELIVERED (accent — happy path) -->
      <path d="M300 160 Q460 80 520 160" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="378" y="96" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="105" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">DELIVER</text>

      <!-- IN TRANSIT → DELAYED -->
      <path d="M300 184 H520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="378" y="174" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="404" y="183" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">DELAY</text>

      <!-- IN TRANSIT → RETURNED -->
      <path d="M300 208 Q460 288 520 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="378" y="256" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="408" y="265" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">RETURN</text>

      <!-- ══ NODES ══ -->

      <!-- Start dot -->
      <circle cx="48" cy="184" r="8" fill="#2d3142"/>

      <!-- IN TRANSIT -->
      <rect x="100" y="144" width="200" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="108" y="152" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="140" y="161" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">IN TRANSIT</text>
      <text x="200" y="196" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">In Transit</text>
      <text x="200" y="213" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">29.4% of 1M orders</text>

      <!-- DELIVERED (focal) — top right -->
      <rect x="520" y="120" width="200" height="88" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="528" y="128" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="554" y="137" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">TERMINAL</text>
      <text x="620" y="170" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Delivered</text>
      <text x="620" y="187" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">29.5% · happy path</text>
      <text x="620" y="200" fill="#eb6c36" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">immutable</text>

      <!-- DELAYED — middle right -->
      <rect x="520" y="148" width="200" height="80" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
      <!-- note: DELAYED is rendered above DELIVERED vertically — adjust y coords -->

      <!-- ══ Re-layout: 3 terminal states stacked on the right ══
           DELIVERED  y=64..152
           DELAYED    y=164..252
           RETURNED   y=264..352
      -->

      <!-- Wipe placeholder rects and redo from scratch with proper positions -->

      <!-- ══ NODES (FINAL LAYOUT) ══ -->

      <!-- Terminal state zone annotation -->
      <rect x="508" y="52" width="276" height="316" rx="8" fill="transparent" stroke="rgba(45,49,66,0.08)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <text x="646" y="40" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.10em">TERMINAL STATES · IMMUTABLE</text>

      <!-- DELIVERED (focal) -->
      <rect x="516" y="56" width="256" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="524" y="64" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="550" y="73" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">DELIVERED</text>
      <text x="644" y="104" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Delivered</text>
      <text x="644" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">295,234 orders · 29.5%</text>

      <!-- DELAYED -->
      <rect x="516" y="156" width="256" height="80" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="524" y="164" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="544" y="173" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">DELAYED</text>
      <text x="644" y="204" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Delayed</text>
      <text x="644" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">294,983 orders · 29.5%</text>

      <!-- RETURNED -->
      <rect x="516" y="256" width="256" height="80" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="524" y="264" width="52" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="550" y="273" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">RETURNED</text>
      <text x="644" y="304" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Returned</text>
      <text x="644" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">115,990 orders · 11.6%</text>

      <!-- ══ TRANSITIONS (final, matching new positions) ══ -->
      <!-- Wipe old connectors and redraw for the 3-state vertical layout -->

      <!-- Start dot (re-render on top of background) -->
      <rect x="0" y="160" width="112" height="48" fill="#f5f5f5"/><!-- canvas clear -->
      <rect width="800" height="400" fill="url(#dots)" opacity="0.0"/><!-- no double-dot -->

      <!-- IN TRANSIT box (re-render clean) -->
      <rect x="96" y="160" width="192" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="96" y="160" width="192" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="104" y="168" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="136" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">IN TRANSIT</text>
      <text x="192" y="208" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">In Transit</text>
      <text x="192" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">293,793 · 29.4%</text>

      <!-- Start → IN TRANSIT -->
      <circle cx="48" cy="200" r="8" fill="#2d3142"/>
      <line x1="56" y1="200" x2="96" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- IN TRANSIT right-edge exit x=288 → DELIVERED top-center x=644, y=56+4=60 via elbow -->
      <!-- Elbow: right from 288,200 → x=504, then up to y=96 (mid of DELIVERED) -->
      <path d="M288 192 Q504 192 504 96 Q504 96 516 96" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="358" y="174" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="384" y="183" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">DELIVER</text>

      <!-- IN TRANSIT → DELAYED: straight right from 288,200 → 516,196 -->
      <path d="M288 200 H516" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="374" y="190" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="396" y="199" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">DELAY</text>

      <!-- IN TRANSIT → RETURNED: right from 288,208 → elbow down to y=296 center of RETURNED -->
      <path d="M288 208 Q504 208 504 296 Q504 296 516 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="358" y="242" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="384" y="251" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">RETURN</text>

      <!-- ══ LEGEND ══ -->
      <line x1="20" y1="372" x2="780" y2="372" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="20" y1="380" x2="44" y2="380" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="50" y="383" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">Happy path (Delivered)</text>
      <line x1="200" y1="380" x2="224" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="230" y="383" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">Alternate terminal transitions</text>
      <circle cx="472" cy="380" r="5" fill="#2d3142"/>
      <text x="482" y="383" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">Initial state</text>
      <text x="564" y="383" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">API enforces · DB CHECK guards enum</text>
    </svg>
  </div>
</body>
</html>
