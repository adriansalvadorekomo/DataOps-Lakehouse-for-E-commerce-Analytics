  <h1>Order lifecycle — from dashboard to analytical layer</h1>

  <!--
    Actors (4 lanes):
      REACT DASHBOARD   — user-facing interface (:5173)
      FASTAPI BACKEND   — validation, business rules, orchestration (:8000)
      POSTGRESQL OLTP   — durable state, constraints, audit
      DATABRICKS        — ingestion, transformation, KPI models

    Steps (6):
      01 CREATE       02 VALIDATE     03 PERSIST (focal)
      04 AUDIT        05 INGEST       06 ANALYZE

    The focal step is PERSIST: the moment the order + line items + stock
    decrement + audit all commit atomically in one PostgreSQL transaction.
    That is the most important invariant in the whole system.

    viewBox: 1080 × 436  (4 lanes × 80 + 36 header + 80 legend)
  -->
