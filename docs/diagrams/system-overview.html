  <h1>System overview — one source, two serve paths</h1>

    system zones (OLTP vs Databricks lakehouse — a real boundary: they never

      LIVE  — PostgreSQL serves the app over the top corridor (link-blue);
              the app never queries the lakehouse.
      SERVE — Gold serves BI dashboards (accent, serve-flow rule).
    The order-writing side of the app is told by order-lifecycle.html; the
    writes are summarized in the app node's sublabel instead of a second box
    (two boxes for one app would be a duplication anti-pattern).
    8 nodes · 7 arrows · 1 focal node (Gold) · 2 zones.
