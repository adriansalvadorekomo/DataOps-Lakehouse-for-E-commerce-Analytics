  <h1>System design — current deployment and future scaling</h1>

      LEFT  — current (what actually runs: 3 compose containers + external Databricks)
      RIGHT — future scaling proposal (load balancer, replicas, pooler — NOT deployed)

    with labels beside the segments. Right panel uses a public-edge row and a
    data-tier row with /4-grid geometry and real gaps for arrow labels.
    Note: the canvas deliberately exceeds the 6-node budget — the two panels
    are the overview+detail split the type recommends, kept together so the
    current-vs-proposed contrast reads at a glance.
    Focal: backend replicas (the scaling subject) + the accent WAL stream.
  -->
