  <p class="eyebrow">Deployment · Smart-ERP</p>
  <h1>System design — current deployment and future scaling</h1>

  <!--
    Two panels side by side:

    LEFT  — Current architecture (what actually runs today)
            Docker Compose: postgres:5432 + backend:8000 (uvicorn) + frontend:8080 (nginx)
            Local dev: embedded pgserver + uvicorn + vite:5173
            Databricks workspace (external, always real, not containerized)

    RIGHT — Future scaling architecture (design proposal, not deployed)
            Browser → DNS → Load Balancer → backend replicas (uvicorn)
            → PostgreSQL primary (+ read replica) + pgBouncer
            Databricks workspace unchanged

    The divider between panels carries a clear label distinguishing current from future.

    viewBox: 1080 × 520
  -->
